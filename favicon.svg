<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="tcmGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a4b3d"/>
      <stop offset="50%" stop-color="#3d6d58"/>
      <stop offset="100%" stop-color="#ba442a"/>
    </linearGradient>
    <linearGradient id="goldGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ba442a"/>
      <stop offset="100%" stop-color="#d4af37"/>
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1a201c" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <!-- Subtle circular background in warm parchment -->
  <rect width="128" height="128" rx="28" fill="#fbf9f5"/>
  <rect width="124" height="124" x="2" y="2" rx="26" fill="none" stroke="#2a4b3d" stroke-opacity="0.15" stroke-width="2"/>
  
  <!-- Harmonious Zen Ensō / Yin-Yang Flow Ring -->
  <path d="M 64,16 
           C 90.5,16 112,37.5 112,64 
           C 112,85.2 98.3,103.2 79,109.6
           C 74,111.2 68.8,112 64,112
           C 37.5,112 16,90.5 16,64
           C 16,42.8 30.3,24.9 50,18.8" 
        fill="none" 
        stroke="url(#tcmGradient)" 
        stroke-width="11" 
        stroke-linecap="round" 
        filter="url(#subtleGlow)"/>

  <!-- Acupuncture Meridian Needle & Energy Seed Accent -->
  <circle cx="64" cy="40" r="7" fill="#ba442a"/>
  <circle cx="64" cy="40" r="3" fill="#fbf9f5"/>
  
  <path d="M 64,52 L 64,88" stroke="url(#goldGradient)" stroke-width="4.5" stroke-linecap="round"/>
  
  <circle cx="64" cy="88" r="4.5" fill="#2a4b3d"/>
</svg>
